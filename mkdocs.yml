site_name: Nmap for Mere Mortals
site_description: Plain-language nmap. Asking your own machines what is listening, reading port states without fooling yourself, version detection that talks to the service, small scripts, and output that lasts, practised on a lab of specimen listeners you stand up yourself.
site_url: https://paulsullivan33-dev.github.io/nmap-for-mere-mortals/

